[package]
name = "scratchpad"
version = "0.1.0"
edition.workspace = true
description = "Minimal TUI for organizing agent work sessions"
license.workspace = true
repository.workspace = true

[[bin]]
name = "sp"
path = "src/main.rs"

[dependencies]
ratatui = "0.30.0"
ratatui-core = "0.1.0"
crossterm = "0.29.0"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "1.1.2"
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
chrono.workspace = true
anyhow.workspace = true
ansi-to-tui = "8.0.1"
rand = "0.9.4"
which = "8.0.2"

[dev-dependencies]
tempfile = "3"
